name: render-test

on:
  push:
    paths:
      - "skills/tailor-resume/scripts/**"
      - "skills/tailor-resume/assets/**"
      - "tests/**"
      - ".github/workflows/render-test.yml"
  pull_request:
  workflow_dispatch:

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install poppler (Linux only, covers the pdftotext path)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python tests/test_build.py
